version: "3.9"

networks:
  plogging-net:
    driver: bridge

volumes:
  pg_plogging_data:
  redis_plogging_data:
  kafka_plogging_data:
  zk_plogging_data:
  minio_plogging_data:
  es_plogging_data:

services:

  # ── PostgreSQL + PostGIS (:5433) ─────────────────────
  postgres-plogging:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plogging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-plogging_db}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
    volumes:
      - pg_plogging_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ../postgres/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5433:5432"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plogging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7.2 (:6380) ───────────────────────────────
  redis-plogging:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD required}}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1 300 10
    volumes:
      - redis_plogging_data:/data
    ports:
      - "6380:6379"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD required}}", "--no-auth-warning", "ping"]
      interval: 10s
      retries: 5

  # ── ZooKeeper ───────────────────────────────────────
  zookeeper-plogging:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_plogging_data:/var/lib/zookeeper
    networks: [plogging-net]

  # ── Kafka (:9093) ───────────────────────────────────
  kafka-plogging:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on: [zookeeper-plogging]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-plogging:2181
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka-plogging:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - kafka_plogging_data:/var/lib/kafka/data
    ports:
      - "9093:9093"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (:9001 API / :9002 Console) ───────────────
  minio-plogging:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-plogging_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    volumes:
      - minio_plogging_data:/data
    ports:
      - "9001:9000"
      - "9002:9002"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      retries: 3

  # ── Elasticsearch (:9201) ───────────────────────────
  es-plogging:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_plogging_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 20s
      retries: 5
