# Meta SW 플로깅 — 풀스택 도커 컴포즈 (인프라 + Python 서비스)
# 맥(Apple Silicon arm64 / Intel amd64) + 리눅스 모두 동작
#
# 빠른 시작:
#   cd platform
#   cp .env.example .env       # 시크릿 채우기
#   docker compose up -d --build
#   open http://localhost:8500  # Gateway (정적 파일 + API 프록시)
#
# 로그: docker compose logs -f gateway sns game gis
# 중지: docker compose down       (-v 옵션 시 볼륨까지 삭제)

name: meta-plogging

networks:
  plogging-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  kafka_data:
  zk_data:
  minio_data:

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: meta-plogging:latest
  restart: unless-stopped
  env_file: .env
  environment:
    # 컨테이너 간 통신용 호스트명 (compose 서비스명)
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MINIO_ENDPOINT: minio:9000
    MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9001}
    ES_HOST: elasticsearch
    ES_PORT: 9200
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [plogging-net]

services:

  # ═══════════════════════════════════════════════════════════
  # 인프라
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgis/postgis:16-3.4
    container_name: meta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plogging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-plogging}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plogging}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: meta-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1 300 10
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: meta-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper
    networks: [plogging-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: meta-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9093}:9093"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: meta-minio
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-plogging_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9002"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      retries: 5

  # ═══════════════════════════════════════════════════════════
  # 앱 서비스 (모두 동일 이미지, command만 다름)
  # ═══════════════════════════════════════════════════════════

  gateway:
    <<: *app-base
    container_name: meta-gateway
    command: python services/gateway/main.py
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      ES_HOST: elasticsearch
      ES_PORT: 9200
      # 컨테이너 내 서비스 호스트 (Gateway가 다른 서비스로 프록시할 때)
      SNS_SERVICE_URL: http://sns:8501
      GAME_SERVICE_URL: http://game:8502
      GIS_SERVICE_URL: http://gis:8503
      AI_SERVICE_URL: http://ai:8504
      DATA_SERVICE_URL: http://data:8505
      MCP_SERVER_URL: http://mcp:8510
      WS_SERVICE_URL: http://ws:8520
      POLICY_SERVICE_URL: http://policy:8541
      PORT: 8500
    ports:
      - "${GATEWAY_PORT:-8500}:8500"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8500/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  sns:
    <<: *app-base
    container_name: meta-sns
    command: python services/sns/main.py
    environment:
      SNS_PORT: 8501
    ports:
      - "${SNS_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  game:
    <<: *app-base
    container_name: meta-game
    command: python services/game/main.py
    environment:
      GAME_PORT: 8502
    ports:
      - "${GAME_PORT:-8502}:8502"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8502/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  gis:
    <<: *app-base
    container_name: meta-gis
    command: python services/gis/main.py
    environment:
      GIS_PORT: 8503
    ports:
      - "${GIS_PORT:-8503}:8503"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8503/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  ai:
    <<: *app-base
    container_name: meta-ai
    command: python services/ai/main.py
    environment:
      AI_PORT: 8504
      AI_MODE: dummy
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    ports:
      - "${AI_PORT:-8504}:8504"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8504/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  mcp:
    <<: *app-base
    container_name: meta-mcp
    command: python services/mcp/server.py
    environment:
      MCP_PORT: 8510
    ports:
      - "${MCP_PORT:-8510}:8510"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8510/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # 통계/검색 — PostgreSQL 필수, Elasticsearch 있으면 사용(없으면 PG 폴백)
  data:
    <<: *app-base
    container_name: meta-data
    command: python services/data/main.py
    environment:
      DATA_PORT: 8505
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ROOT_PATH: /api/data   # 게이트웨이 프리픽스 — Swagger(/api/data/docs) 자산 경로 정상화
    ports:
      - "${DATA_PORT:-8505}:8505"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8505/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # WebSocket 실시간 알림 — Redis pub/sub
  ws:
    <<: *app-base
    container_name: meta-ws
    command: python services/ws/main.py
    environment:
      WS_PORT: 8520
    ports:
      - "${WS_PORT:-8520}:8520"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8520/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # 정책/약관 서비스 (단독)
  policy:
    <<: *app-base
    container_name: meta-policy
    command: python services/policy/main.py
    environment:
      POLICY_PORT: 8541
    ports:
      - "${POLICY_PORT:-8541}:8541"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8541/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── 선택적 컴포넌트 ────────────────────────────────────────
  # 인덱싱/검색 기능을 쓸 때만 --profile search로 활성화
  # 사용: docker compose --profile search up -d
  elasticsearch:
    profiles: [search]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    container_name: meta-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "${ES_PORT:-9201}:9200"
    networks: [plogging-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      retries: 10
      start_period: 30s
