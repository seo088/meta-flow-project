<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtraction Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator">
      <h1>Subtraction Calculator</h1>

      <label for="firstNumber">First number</label>
      <input id="firstNumber" type="number" value="10" />

      <label for="secondNumber">Second number</label>
      <input id="secondNumber" type="number" value="3" />

      <div class="actions">
        <button id="subtractButton" type="button">Subtract</button>
        <button id="clearButton" type="button">Clear</button>
      </div>

      <output id="result">Result: 7</output>
    </main>

    <script src="calculator.js"></script>
  </body>
</html>
